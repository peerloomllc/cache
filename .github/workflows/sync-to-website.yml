name: Sync to PeerLoom website

on:
  push:
    branches: [main]
    paths: [cache.html]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cache repo
        uses: actions/checkout@v4

      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          repository: peerloomllc/website
          token: ${{ secrets.WEBSITE_PAT }}
          path: website

      - name: Copy cache.html to website
        run: cp cache.html website/cache/app.html

      - name: Check for changes
        id: diff
        working-directory: website
        run: |
          git diff --quiet cache/app.html && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/app.html
          git commit -m "sync: update cache/app.html from cache repo

          Triggered by ${{ github.event.head_commit.url }}"
          git push
